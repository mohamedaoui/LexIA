services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lexia
      POSTGRES_USER: lexia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexia -d lexia"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://lexia:${POSTGRES_PASSWORD:-lexia}@db:5432/lexia
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
